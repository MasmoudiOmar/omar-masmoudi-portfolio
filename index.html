<html lang="en">
  <head>

    <meta name="twitter:title" content="Omar Masmoudi | Full Stack Software Engineer" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23F7F6F3'/%3E%3Ccircle cx='20' cy='20' r='17' fill='none' stroke='%23171612' stroke-width='1.75'/%3E%3Cpath d='M10.5 26 L16.5 19.5 L23 22.5 L29.5 12.5' fill='none' stroke='%23171612' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10.5' cy='26' r='1.7' fill='%23171612'/%3E%3Ccircle cx='16.5' cy='19.5' r='1.7' fill='%23171612'/%3E%3Ccircle cx='23' cy='22.5' r='1.7' fill='%23171612'/%3E%3Ccircle cx='29.5' cy='12.5' r='3' fill='%23D9420C'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#F7F6F3',      // page ground
              card: '#FFFFFF',       // raised surface
              sunken: '#EDEAE3',     // subtle fill
              ink: '#171612',        // primary text / dark blocks
              muted: '#5C594F',      // secondary text
              faint: '#8A877C',      // tertiary text
              line: '#DFDBD2',       // borders
              accent: '#D9420C',     // hot orange
              deep: '#3D5A4C',       // secondary accent
            },
            fontFamily: {
              sans: ['Outfit', 'system-ui', 'sans-serif'],
              serif: ['"Instrument Serif"', 'Georgia', 'serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* `overflow-x: clip` rather than `hidden`: `hidden` would pair with the
         default `overflow-y: visible` to compute as `auto`, turning these into
         their own scroll containers. Anything overflowing (e.g. a decorative
         transform on a fixed element) would then raise a second scrollbar
         alongside the document's. `clip` crops without scrolling. */
      html { 
        scroll-behavior: smooth; 
        overflow-x: clip;
      }
      
      /* Offset anchor jumps so the fixed nav doesn't cover section headings */
      section[id] { scroll-margin-top: 6rem; }
      body { 
        font-family: 'Outfit', sans-serif; 
        background-color: #F7F6F3; 
        color: #171612;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Grain texture overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 1000;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #EDEAE3; }
      ::-webkit-scrollbar-thumb { background: #CFCBC1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #B4AFA3; }
      
      /* Kept the class name so component markup stays put; it is a paper card now. */
      .glass-panel {
        background: #FFFFFF;
        border: 1px solid #DFDBD2;
      }
      
      ::selection { background: rgba(217, 66, 12, 0.18); }
      
      .font-display {
        font-family: 'Instrument Serif', Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.015em;
      }
      
      /* Entrance animations */
      @keyframes fade-in-up {
        from { 
          opacity: 0; 
          transform: translateY(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }
      
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slide-in-right {
        from { 
          opacity: 0; 
          transform: translateX(30px); 
        }
        to { 
          opacity: 1; 
          transform: translateX(0); 
        }
      }
      
      .animate-fade-in-up {
        animation: fade-in-up 0.6s ease-out forwards;
        opacity: 0;
      }
      
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
        opacity: 0;
      }
      
      .animate-slide-in-right {
        animation: slide-in-right 0.6s ease-out forwards;
        opacity: 0;
      }
      
      /* Section reveal animation */
      .reveal-section {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      
      .reveal-section.visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Blob animation for dynamic background */
      @keyframes blob {
        0%, 100% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(20px, -30px) scale(1.1);
        }
        50% {
          transform: translate(-20px, 20px) scale(0.9);
        }
        75% {
          transform: translate(30px, 10px) scale(1.05);
        }
      }
      
      .animate-blob {
        animation: blob 8s ease-in-out infinite;
      }
      
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      
      .animation-delay-3000 {
        animation-delay: 3s;
      }
      
      .animation-delay-4000 {
        animation-delay: 4s;
      }
      
      /* CSS variable for accent color RGB */
      :root {
        --color-accent-rgb: 217, 66, 12;
      }
      
      /* Terminal loader animations */
      @keyframes terminalFadeIn {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      @keyframes portfolio-enter {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .animate-portfolio-enter {
        animation: portfolio-enter 0.6s ease-out forwards;
      }
      
      /* ── Logo ─────────────────────────────────────────────── */
      .logo-path {
        stroke-dasharray: 27;
        stroke-dashoffset: 0;
      }
      .logo:hover .logo-path,
      a:hover .logo .logo-path {
        animation: logo-draw 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .logo:hover .logo-dot,
      a:hover .logo .logo-dot {
        animation: logo-arrive 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes logo-draw {
        from { stroke-dashoffset: 27; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes logo-arrive {
        0%, 55% { transform: scale(0); }
        75%     { transform: scale(1.35); }
        100%    { transform: scale(1); }
      }
      .logo-dot { transform-origin: 29.5px 12.5px; }
      
      /* ── Editorial line reveal ────────────────────────────── */
      /* Each line sits in its own clipping box and rises into view. */
      .mask-line { display: block; overflow: hidden; padding-bottom: 0.06em; }
      .mask-line > * {
        display: block;
        transform: translateY(110%);
        transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal-section.visible .mask-line > * { transform: translateY(0); }
      
      /* Mount-time reveal needs an animation: a transition has no start state
         to run from when both classes are present on first paint. */
      .mask-rise > * {
        transform: translateY(110%);
        animation: mask-rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes mask-rise {
        from { transform: translateY(110%); }
        to   { transform: translateY(0); }
      }
      
      /* ── Link underline ───────────────────────────────────── */
      .link-underline {
        background-image: linear-gradient(currentColor, currentColor);
        background-size: 0% 1px;
        background-repeat: no-repeat;
        background-position: left 100%;
        transition: background-size 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .link-underline:hover { background-size: 100% 1px; }
      
      /* ── Lift ─────────────────────────────────────────────── */
      .lift { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease; }
      .lift:hover { transform: translateY(-2px); }
      
      .terminal-line {
        animation: terminalFadeIn 0.15s ease-out forwards;
      }
      
      /* Respect users who ask the OS for less motion */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .reveal-section,
        .animate-fade-in-up,
        .animate-fade-in,
        .animate-slide-in-right,
        .mask-line > *,
        .mask-rise > * {
          opacity: 1 !important;
          transform: none !important;
        }
        .logo-path { stroke-dashoffset: 0 !important; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
